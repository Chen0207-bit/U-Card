<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>优卡 U-Card · 持卡人服务</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
  min-height:100vh;
  background:linear-gradient(150deg,#4f46e5 0%,#7c3aed 55%,#312e81 100%);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:32px 18px;
}
.wrap{width:min(860px,100%);text-align:center}
.logo{
  width:84px;height:84px;margin:0 auto;border-radius:24px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);
  display:flex;align-items:center;justify-content:center;
  font-size:44px;font-weight:900;color:#fff;
  box-shadow:0 14px 40px rgba(0,0,0,.25);
}
h1{color:#fff;font-size:27px;font-weight:900;margin:22px 0 8px;letter-spacing:.5px}
.sub{color:rgba(255,255,255,.78);font-size:14px;margin:0 0 38px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:700px){.cards{grid-template-columns:1fr}}
.ecard{
  display:block;background:#fff;border-radius:20px;padding:36px 28px 30px;
  text-decoration:none;color:#0f172a;box-shadow:0 16px 44px rgba(0,0,0,.28);
  transition:transform .18s ease,box-shadow .18s ease;
}
.ecard:hover{transform:translateY(-7px);box-shadow:0 26px 60px rgba(0,0,0,.38)}
.ecard .ico{font-size:54px;line-height:1}
.ecard b{display:block;font-size:20px;font-weight:900;margin-top:14px}
.ecard .desc{display:block;font-size:13px;color:#64748b;margin-top:9px;line-height:1.75}
.ecard .go{display:block;color:#4f46e5;font-size:13px;font-weight:800;margin-top:16px}
.foot{color:rgba(255,255,255,.55);font-size:12px;margin-top:34px}
.foot a{color:rgba(255,255,255,.82)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">U</div>
  <h1>优卡 U-Card · 持卡人服务</h1>
  <p class="sub">选择版本进入, 账号与数据实时同步</p>
  <div class="cards">
    <a class="ecard" href="/app/m">
      <div class="ico">📱</div>
      <b>手机版 H5</b>
      <span class="desc">卡包 / 充值 / 消费 / 积分商城<br>触屏优化, 随时随地管理卡片</span>
      <span class="go">进入手机版 →</span>
    </a>
    <a class="ecard" href="/app/pc">
      <div class="ico">🖥</div>
      <b>电脑网页版</b>
      <span class="desc">宽屏看板式布局<br>交易明细更清晰, 适合演示与办公</span>
      <span class="go">进入电脑版 →</span>
    </a>
  </div>
  <p class="foot">两版共用同一账号 · 数据实时同步 ｜ <a href="/admin">运营后台 → /admin</a></p>
</div>
</body>
</html>
