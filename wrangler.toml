name = "fc-ucard"
main = "worker.js"
compatibility_date = "2026-08-01"

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none" # 禁用 .html 规范化重定向, 让 worker 的路径重写(/app/m 等)直接生效

[[durable_objects.bindings]]
name = "APP_STATE"
class_name = "AppState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AppState"]
